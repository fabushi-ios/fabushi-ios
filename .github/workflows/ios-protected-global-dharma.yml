name: iOS protected Global Dharma journey

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/ios-protected-global-dharma.yml"
      - "docs/parity/desktop-main-impact.json"
      - "mobile/ios/**"
      - "source/packages/mahayana-rs/**"
      - "scripts/build-mahayana-ios.sh"
      - "scripts/check-desktop-main-ios-architecture.py"
      - "tests/**"
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact accepted source SHA to exercise in a fresh Simulator.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ios-protected-global-dharma-${{ github.event.pull_request.number || inputs.source_sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  protected-journey:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 3
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVICE_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}-ios-app
      FABUSHI_API_BASE_URL: ${{ vars.FABUSHI_API_BASE_URL || 'https://api.ombhrum.com' }}
      FABUSHI_CI_TEST_USERNAME: ${{ secrets.FABUSHI_CI_TEST_USERNAME }}
      FABUSHI_CI_TEST_PASSWORD: ${{ secrets.FABUSHI_CI_TEST_PASSWORD }}
    steps:
      - name: Checkout exact accepted source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.source_sha }}
          fetch-depth: 1

      - name: Verify exact source and initialize evidence paths
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || inputs.source_sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          {
            echo "SOURCE_SHA=$actual"
            echo "DERIVED_DATA=$RUNNER_TEMP/fabushi-ios-protected-derived"
            echo "FABUSHI_CI_ACCOUNT_SESSION_FILE=$RUNNER_TEMP/fabushi-ci/session.json"
            echo "EVIDENCE_DIR=$GITHUB_WORKSPACE/ios-protected-journey-evidence"
          } >> "$GITHUB_ENV"
          mkdir -p ios-protected-journey-evidence/screenshots
          {
            echo "source_sha=$actual"
            echo "workflow_run_id=$GITHUB_RUN_ID"
            echo "workflow_run_attempt=$GITHUB_RUN_ATTEMPT"
          } > ios-protected-journey-evidence/source.env

      - name: Require protected account credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FABUSHI_CI_TEST_USERNAME"
          test -n "$FABUSHI_CI_TEST_PASSWORD"

      - name: Set up Rust for Apple Silicon iOS Simulator
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim

      - name: Install XcodeGen
        run: command -v xcodegen >/dev/null 2>&1 || brew install xcodegen

      - id: simulator
        name: Select, erase, and boot fresh iOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          pair="$(
            xcrun simctl list devices available -j |
            python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next((runtime+"|"+x["udid"] for runtime,xs in d.items() if "SimRuntime.iOS-" in runtime for x in xs if x.get("isAvailable") and x["name"].startswith("iPhone")), ""))'
          )"
          runtime="${pair%%|*}"
          udid="${pair#*|}"
          test -n "$runtime"
          test -n "$udid"
          test "$runtime" != "$udid"
          xcrun simctl shutdown "$udid" 2>/dev/null || true
          xcrun simctl erase "$udid"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          echo "runtime=$runtime" >> "$GITHUB_OUTPUT"
          xcrun simctl io "$udid" screenshot "$EVIDENCE_DIR/screenshots/000-fresh-simulator.png"

      - name: Start full-session video
        shell: bash
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          xcrun simctl io "$UDID" recordVideo --codec=h264 "$EVIDENCE_DIR/session.mp4" > "$EVIDENCE_DIR/video-recorder.log" 2>&1 &
          echo $! > "$EVIDENCE_DIR/video-recorder.pid"

      - name: Build iOS-owned native runtime for Simulator
        run: scripts/build-mahayana-ios.sh iphonesimulator arm64

      - name: Generate Xcode project
        working-directory: mobile/ios
        run: xcodegen generate

      - name: Build application and tests once
        working-directory: mobile/ios
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -o pipefail
          xcodebuild \
            -project Fabushi.xcodeproj \
            -scheme Fabushi \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            build-for-testing \
            | tee "$EVIDENCE_DIR/xcode-build.log"

      - id: install
        name: Install exact built app and stage bounded account session
        shell: bash
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set -euo pipefail
          app="$DERIVED_DATA/Build/Products/Debug-iphonesimulator/Fabushi.app"
          test -d "$app"
          xcrun simctl install "$UDID" "$app"

          node .github/scripts/prepare-ios-ci-session.mjs
          test -s "$FABUSHI_CI_ACCOUNT_SESSION_FILE"

          app_container="$(xcrun simctl get_app_container "$UDID" com.ombhrum.fabushi data)"
          test -d "$app_container"
          session_in_simulator="$app_container/Documents/fabushi-ci-session.json"
          cp "$FABUSHI_CI_ACCOUNT_SESSION_FILE" "$session_in_simulator"
          chmod 600 "$session_in_simulator"

          echo "session_in_simulator=$session_in_simulator" >> "$GITHUB_OUTPUT"
          echo "app_container=$app_container" >> "$GITHUB_OUTPUT"
          xcrun simctl io "$UDID" screenshot "$EVIDENCE_DIR/screenshots/010-app-installed-session-staged.png"

      - name: Run protected marketplace-bot-WebMCP-commerce journey
        working-directory: mobile/ios
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
          FABUSHI_CI_APP_SESSION_IN_SIMULATOR: ${{ steps.install.outputs.session_in_simulator }}
          FABUSHI_E2E_SOURCE_SHA: ${{ github.event.pull_request.head.sha || inputs.source_sha }}
          FABUSHI_E2E_SCREENSHOT_DIR: ${{ github.workspace }}/ios-protected-journey-evidence/screenshots
          FABUSHI_E2E_STATE_FILE: ${{ github.workspace }}/ios-protected-journey-evidence/state.json
          FABUSHI_DEVICE_NAME: Fabushi Protected iOS Simulator
        run: |
          set -euo pipefail
          test -s "$FABUSHI_CI_ACCOUNT_SESSION_FILE"
          session_b64="$(python3 - "$FABUSHI_CI_ACCOUNT_SESSION_FILE" <<'PY'
          import base64
          import pathlib
          import sys
          payload = pathlib.Path(sys.argv[1]).read_bytes()
          if not payload or len(payload) > 64 * 1024:
              raise SystemExit("Protected Fabushi CI session has an invalid size")
          sys.stdout.write(base64.b64encode(payload).decode("ascii"))
          PY
          )"
          export TEST_RUNNER_FABUSHI_CI_ACCOUNT_SESSION_BASE64="$session_b64"
          export TEST_RUNNER_FABUSHI_CI_API_BASE_URL="$FABUSHI_API_BASE_URL"
          export TEST_RUNNER_FABUSHI_E2E_SOURCE_SHA="$FABUSHI_E2E_SOURCE_SHA"
          export TEST_RUNNER_FABUSHI_DEVICE_NAME="$FABUSHI_DEVICE_NAME"
          for key in GITHUB_ACTIONS GITHUB_REPOSITORY GITHUB_WORKFLOW GITHUB_JOB GITHUB_RUN_ID GITHUB_RUN_ATTEMPT RUNNER_NAME RUNNER_OS RUNNER_ARCH; do
            value="${!key:-}"
            if [ -n "$value" ]; then
              export "TEST_RUNNER_${key}=$value"
            fi
          done

          rm -rf "$EVIDENCE_DIR/GlobalDharmaJourney.xcresult"
          set -o pipefail
          xcodebuild \
            -project Fabushi.xcodeproj \
            -scheme Fabushi \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$EVIDENCE_DIR/GlobalDharmaJourney.xcresult" \
            -only-testing:FabushiUITests/GlobalDharmaJourneyUITests/testGlobalDharmaMarketplaceBotWebMcpCommerceJourney \
            test-without-building \
            2>&1 | tee "$EVIDENCE_DIR/xcode-protected-journey.log"

          python3 - "$EVIDENCE_DIR/xcode-protected-journey.log" "$EVIDENCE_DIR/state.json" <<'PY'
          import base64
          import pathlib
          import re
          import sys
          log = pathlib.Path(sys.argv[1]).read_text(errors="replace")
          matches = re.findall(r"FABUSHI_E2E_STATE_BASE64=([A-Za-z0-9+/=]+)", log)
          if not matches:
              raise SystemExit("protected UI test produced no state marker")
          pathlib.Path(sys.argv[2]).write_bytes(base64.b64decode(matches[-1], validate=True))
          PY

      - name: Require complete journey state
        shell: bash
        run: |
          set -euo pipefail
          test -s "$EVIDENCE_DIR/state.json"
          jq -e '
            .autoLogin == true and
            .searchedMiniApps == true and
            .globalDharmaVisible == true and
            .installedOrAlreadyInstalled == true and
            .botVisible == true and
            .naturalLanguageSent == true and
            .webMcpReady == true and
            .permissionDeniedObserved == true and
            .livePageMutationObserved == true and
            .bidirectionalStateObserved == true and
            .entitlementAllowed == true and
            .restoreTapped == true
          ' "$EVIDENCE_DIR/state.json" >/dev/null

      - name: Collect final evidence
        if: always()
        shell: bash
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set +e
          if [ -f "$EVIDENCE_DIR/video-recorder.pid" ]; then
            video_pid="$(cat "$EVIDENCE_DIR/video-recorder.pid")"
            kill -INT "$video_pid" 2>/dev/null || true
            wait "$video_pid" 2>/dev/null || true
          fi
          if [ -n "${UDID:-}" ]; then
            xcrun simctl io "$UDID" screenshot "$EVIDENCE_DIR/screenshots/999-final.png" || true
            xcrun simctl spawn "$UDID" log show --style compact --last 20m --predicate 'process == "Fabushi"' > "$EVIDENCE_DIR/fabushi-system.log" 2>&1 || true
          fi
          {
            echo "# Protected iOS Global Dharma journey"
            echo
            echo "- Source SHA: \`${SOURCE_SHA:-unknown}\`"
            echo "- Bounded session: refresh-token-free app projection"
            echo "- Commerce: canonical CI ledger mode; no real StoreKit charge"
            echo "- Evidence: xcresult, state, screenshots, video, app/system logs"
          } > "$EVIDENCE_DIR/README.md"

      - name: Upload journey evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-protected-global-dharma-${{ github.event.pull_request.head.sha || inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ios-protected-journey-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Delete fresh Simulator
        if: always()
        shell: bash
        env:
          UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          set +e
          if [ -n "${UDID:-}" ]; then
            xcrun simctl shutdown "$UDID" || true
            xcrun simctl erase "$UDID" || true
          fi
