name: iOS native context injection focused

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - source/packages/mahayana-rs/mahayana-core/src/lib.rs
      - source/packages/mahayana-rs/mahayana-agent/src/lib.rs
      - source/packages/mahayana-rs/mahayana-conversation/src/lib.rs
      - source/packages/mahayana-rs/mahayana-runtime/src/kernel_conversation.rs
      - source/packages/mahayana-rs/mahayana-runtime/src/lib.rs
      - source/packages/mahayana-rs/mahayana-native-agent/src/lib.rs
      - source/packages/mahayana-rs/mahayana-native-engine/src/lib.rs
      - .github/workflows/ios-native-context-injection-focused.yml

permissions:
  contents: read

jobs:
  rust-context-injection:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git show -s --format='source_sha=%H source_tree=%T' HEAD

      - name: Install Rust host build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y pkg-config libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev libxkbcommon-dev

      - name: Test NativeAgentBackend context injection workflow control
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/context-injection-evidence"
          mkdir -p "$evidence"
          cargo test --manifest-path source/packages/mahayana-rs/Cargo.toml \
            -p mahayana-native-agent --lib --profile ci \
            context_injection_ \
            2>&1 | tee "$evidence/native-agent-context-injection.log"
          cargo test --manifest-path source/packages/mahayana-rs/Cargo.toml \
            -p mahayana-native-engine --lib --profile ci \
            context_signal_ \
            2>&1 | tee "$evidence/native-engine-context-signal.log"
          cargo test --manifest-path source/packages/mahayana-rs/Cargo.toml \
            -p mahayana-runtime --lib --profile ci \
            2>&1 | tee "$evidence/runtime-wiring.log"
          grep -F 'struct ContextInjectionWorkflowControlStore' \
            source/packages/mahayana-rs/mahayana-native-agent/src/lib.rs \
            | tee "$evidence/production-wiring.txt"
          grep -F 'async fn inject_context' \
            source/packages/mahayana-rs/mahayana-runtime/src/kernel_conversation.rs \
            | tee -a "$evidence/production-wiring.txt"
          grep -F 'RuntimeCommand::InjectContext' \
            source/packages/mahayana-rs/mahayana-runtime/src/lib.rs \
            | tee -a "$evidence/production-wiring.txt"
          grep -F 'pub struct ToolContextSignal' \
            source/packages/mahayana-rs/mahayana-native-engine/src/lib.rs \
            | tee -a "$evidence/production-wiring.txt"
          grep -m 1 -F 'conversationActionRef' \
            source/packages/mahayana-rs/mahayana-native-agent/src/lib.rs \
            | tee -a "$evidence/production-wiring.txt"
          printf '%s\n' "${{ github.event.pull_request.head.sha }}" > "$evidence/head-sha.txt"

      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-native-context-injection-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/context-injection-evidence
          if-no-files-found: error
