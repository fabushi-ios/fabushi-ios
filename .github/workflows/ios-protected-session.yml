name: iOS protected session acceptance

on:
  pull_request:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source SHA to exercise with the bounded Fabushi CI account.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ios-protected-session-${{ github.event.pull_request.number || inputs.source_sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  protected-account-ui:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      FABUSHI_CI_TEST_USERNAME: ${{ secrets.FABUSHI_CI_TEST_USERNAME }}
      FABUSHI_CI_TEST_PASSWORD: ${{ secrets.FABUSHI_CI_TEST_PASSWORD }}
      FABUSHI_API_BASE_URL: ${{ vars.FABUSHI_API_BASE_URL || 'https://api.ombhrum.com' }}
      MAHAYANA_API_BASE_URL: ${{ vars.FABUSHI_API_BASE_URL || 'https://api.ombhrum.com' }}
      FABUSHI_FEATURE_HOST_TEST: '0'
      FABUSHI_E2E_REQUIRE_REAL_APPLE_COMMERCE: ${{ vars.FABUSHI_E2E_REQUIRE_REAL_APPLE_COMMERCE || '0' }}
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.source_sha }}
          fetch-depth: 1

      - name: Verify exact source identity
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || inputs.source_sha }}
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          {
            echo "SOURCE_SHA=$actual"
            echo "EVIDENCE_DIR=$GITHUB_WORKSPACE/ios-protected-session-evidence"
          } >> "$GITHUB_ENV"
          mkdir -p ios-protected-session-evidence/screenshots
          SOURCE_TREE="$(git rev-parse HEAD^{tree})"
          DESKTOP_HEAD_SHA="$(python3 -c 'import json; print(json.load(open("manifests/desktop-main-authority.json"))["commit"])')"
          DESKTOP_TREE_SHA="$(python3 -c 'import json; print(json.load(open("manifests/desktop-main-authority.json"))["rootTreeSha"])')"
          [[ "$SOURCE_TREE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DESKTOP_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DESKTOP_TREE_SHA" =~ ^[0-9a-f]{40}$ ]]
          ARTIFACT_NAME="fabushi-ios-protected-session-${actual}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            echo "source_sha=$actual"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "IOS_HEAD_SHA=$actual"
            echo "IOS_EXPECTED_HEAD_SHA=$EXPECTED_SHA"
            echo "IOS_TREE_SHA=$SOURCE_TREE"
            echo "DESKTOP_HEAD_SHA=$DESKTOP_HEAD_SHA"
            echo "DESKTOP_TREE_SHA=$DESKTOP_TREE_SHA"
            echo "WORKFLOW_HEAD_SHA=$EXPECTED_SHA"
            echo "WORKFLOW_EVENT_SHA=$GITHUB_SHA"
            echo "REPOSITORY=$GITHUB_REPOSITORY"
            echo "ARTIFACT_NAME=$ARTIFACT_NAME"
            echo "EVIDENCE_KIND=protected-simulator-global-dharma-journey"
            echo "SIGNED_EXPORT_NOT_PROVEN=true"
            echo "REAL_DEVICE_JOURNEY_NOT_PROVEN=true"
            echo "PERFORMANCE_ACCEPTANCE_NOT_PROVEN=true"
          } > ios-protected-session-evidence/source.env

      - name: Verify live Desktop main before protected acceptance
        run: python3 scripts/check-desktop-main-ios-architecture.py --authority-only

      - name: Require protected Fabushi CI account
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FABUSHI_CI_TEST_USERNAME:-}" ] || [ -z "${FABUSHI_CI_TEST_PASSWORD:-}" ]; then
            echo "FABUSHI_CI_TEST_USERNAME and FABUSHI_CI_TEST_PASSWORD are required." >&2
            exit 2
          fi

      - name: Verify protected commerce is real-service only
        shell: bash
        run: |
          set -euo pipefail
          test "${FABUSHI_FEATURE_HOST_TEST:-}" = "0"
          python3 - <<'PY'
          from pathlib import Path
          host = Path("source/host/MahayanaHostRuntime.swift").read_text()
          model = Path("mobile/ios/Fabushi/GlobalDharmaCommerceModel.swift").read_text()
          bridge = Path("mobile/ios/Fabushi/GlobalDharmaMiniAppBridge.swift").read_text()
          ui = Path("mobile/ios/FabushiUITests/GlobalDharmaJourneyUITests.swift").read_text()
          forbidden_host = ("MobileCanonicalCICommerceLedger", "ciCommerceLedger", "canonical-commerce-ledger")
          if any(token in host for token in forbidden_host):
              raise SystemExit("protected acceptance still contains a synthetic Host commerce ledger")
          if "canonicalLedgerTestMode" in model or "purchaseLifetimeThroughCanonicalLedger" in model:
              raise SystemExit("protected acceptance still contains automatic synthetic commerce in the production model")
          marker = 'return environment["FABUSHI_FEATURE_HOST_TEST"] == "1"'
          if marker not in bridge:
              raise SystemExit("test commerce must require the explicit test-only feature-host flag")
          if 'app.launchEnvironment["FABUSHI_FEATURE_HOST_TEST"] = "0"' not in ui:
              raise SystemExit("protected UI launch must explicitly disable test commerce")
          PY

      - name: Install simulator build tools
        shell: bash
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          rustup target add aarch64-apple-ios-sim

      - name: Select and boot simulator
        id: sim
        shell: bash
        run: |
          set -euo pipefail
          UDID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for xs in d.values() for x in xs if x["name"].startswith("iPhone")))')"
          xcrun simctl shutdown "$UDID" 2>/dev/null || true
          xcrun simctl erase "$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl io "$UDID" screenshot "$EVIDENCE_DIR/screenshots/000-fresh-simulator.png"

      - name: Start protected-session video
        shell: bash
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -euo pipefail
          xcrun simctl io "$UDID" recordVideo --codec=h264 "$EVIDENCE_DIR/session.mp4" > "$EVIDENCE_DIR/video-recorder.log" 2>&1 &
          echo $! > "$EVIDENCE_DIR/video-recorder.pid"

      - name: Build iOS-owned Rust runtime for simulator
        run: scripts/build-mahayana-ios.sh iphonesimulator arm64

      - name: Generate Xcode project
        working-directory: mobile/ios
        run: xcodegen generate

      - name: Build app and UI tests for protected acceptance
        working-directory: mobile/ios
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build-for-testing \
            -project Fabushi.xcodeproj \
            -scheme Fabushi \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/FabushiProtectedDerivedData"

      - name: Prepare bounded refresh-token-free account session
        shell: bash
        env:
          DEVICE_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}-ios-app
          FABUSHI_CI_ACCOUNT_SESSION_FILE: ${{ runner.temp }}/fabushi-ci/account-session.json
        run: |
          set -euo pipefail
          node .github/scripts/prepare-ios-ci-session.mjs
          test -s "$FABUSHI_CI_ACCOUNT_SESSION_FILE"
          test "$(stat -f '%Lp' "$FABUSHI_CI_ACCOUNT_SESSION_FILE")" = "600"
          echo "HOST_CI_SESSION=$FABUSHI_CI_ACCOUNT_SESSION_FILE" >> "$GITHUB_ENV"

      - name: Resolve protected UI runner configuration
        shell: bash
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set -euo pipefail
          test -s "$HOST_CI_SESSION"

          xctestrun="$(find "$RUNNER_TEMP/FabushiProtectedDerivedData/Build/Products" -name '*.xctestrun' -type f -print -quit)"
          test -n "$xctestrun"
          test -f "$xctestrun"

          api_base="$(python3 - <<'PY'
          import os
          print(os.environ["FABUSHI_API_BASE_URL"].strip(), end="")
          PY
          )"
          case "$api_base" in
            https://*) ;;
            *)
              echo "Protected Fabushi API/model base must use HTTPS" >&2
              exit 2
              ;;
          esac

          echo "PROTECTED_XCTESTRUN=$xctestrun" >> "$GITHUB_ENV"
          xcrun simctl io "$UDID" screenshot "$EVIDENCE_DIR/screenshots/010-session-ready.png"

      - name: Run real protected-session Global Dharma journey
        working-directory: mobile/ios
        shell: bash
        env:
          FABUSHI_E2E_SOURCE_SHA: ${{ github.event.pull_request.head.sha || inputs.source_sha }}
          FABUSHI_DEVICE_NAME: Fabushi Protected iOS Simulator
        run: |
          set -euo pipefail
          rm -rf "$EVIDENCE_DIR/FabushiProtectedSession.xcresult"
          set -o pipefail
          test -f "$PROTECTED_XCTESTRUN"
          test -s "$HOST_CI_SESSION"

          api_base="$(python3 - <<'PY'
          import os
          print(os.environ["FABUSHI_API_BASE_URL"].strip(), end="")
          PY
          )"
          case "$api_base" in
            https://*) ;;
            *)
              echo "Protected Fabushi API/model base must use HTTPS" >&2
              exit 2
              ;;
          esac

          session_b64="$(python3 - "$HOST_CI_SESSION" <<'PY'
          import base64
          import pathlib
          import sys

          payload = pathlib.Path(sys.argv[1]).read_bytes()
          if not payload or len(payload) > 64 * 1024:
              raise SystemExit("Protected Fabushi CI session has an invalid size")
          sys.stdout.write(base64.b64encode(payload).decode("ascii"))
          PY
          )"

          # xcodebuild only forwards custom process environment into its test
          # runner when the variables use the TEST_RUNNER_ prefix. XCTest sees
          # these under their original names, keeping the protected endpoint and
          # bounded session out of app defaults and source.
          export TEST_RUNNER_FABUSHI_CI_ACCOUNT_SESSION_BASE64="$session_b64"
          export TEST_RUNNER_FABUSHI_CI_API_BASE_URL="$api_base"
          export TEST_RUNNER_FABUSHI_E2E_SOURCE_SHA="$FABUSHI_E2E_SOURCE_SHA"
          export TEST_RUNNER_FABUSHI_DEVICE_NAME="$FABUSHI_DEVICE_NAME"
          export TEST_RUNNER_FABUSHI_E2E_REQUIRE_REAL_APPLE_COMMERCE="${FABUSHI_E2E_REQUIRE_REAL_APPLE_COMMERCE:-0}"
          for key in \
            GITHUB_ACTIONS GITHUB_REPOSITORY GITHUB_WORKFLOW GITHUB_JOB \
            GITHUB_RUN_ID GITHUB_RUN_ATTEMPT RUNNER_NAME RUNNER_OS RUNNER_ARCH
          do
            value="${!key:-}"
            if [ -n "$value" ]; then
              export "TEST_RUNNER_${key}=$value"
            fi
          done

          # build-for-testing creates both the app and the UI-test runner, but
          # the explicit .xctestrun path does not reliably install the runner
          # before FrontBoard launch on fresh macOS-15 simulators. Install and
          # verify both built products first; the real protected journey and all
          # of its assertions still execute through the same .xctestrun.
          app_bundle="$(find "$RUNNER_TEMP/FabushiProtectedDerivedData/Build/Products/Debug-iphonesimulator" -maxdepth 1 -name 'Fabushi.app' -type d -print -quit)"
          test_runner="$(find "$RUNNER_TEMP/FabushiProtectedDerivedData/Build/Products/Debug-iphonesimulator" -maxdepth 1 -name 'FabushiUITests-Runner.app' -type d -print -quit)"
          test -n "$app_bundle"
          test -d "$app_bundle"
          test -n "$test_runner"
          test -d "$test_runner"
          xcrun simctl install "${{ steps.sim.outputs.udid }}" "$app_bundle"
          xcrun simctl install "${{ steps.sim.outputs.udid }}" "$test_runner"
          xcrun simctl get_app_container "${{ steps.sim.outputs.udid }}" com.ombhrum.fabushi app >/dev/null
          xcrun simctl get_app_container "${{ steps.sim.outputs.udid }}" com.ombhrum.FabushiUITests.xctrunner app >/dev/null

          xcodebuild test-without-building \
            -xctestrun "$PROTECTED_XCTESTRUN" \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath "$EVIDENCE_DIR/FabushiProtectedSession.xcresult" \
            -only-testing:FabushiUITests/GlobalDharmaJourneyUITests/testGlobalDharmaMarketplaceBotWebMcpCommerceJourney \
            2>&1 | tee "$EVIDENCE_DIR/protected-xcodebuild.log"
          python3 - "$EVIDENCE_DIR/protected-xcodebuild.log" "$EVIDENCE_DIR/state.json" <<'PY'
          import base64
          import pathlib
          import re
          import sys

          log = pathlib.Path(sys.argv[1]).read_text(errors="replace")
          matches = re.findall(r"FABUSHI_E2E_STATE_BASE64=([A-Za-z0-9+/=]+)", log)
          if not matches:
              raise SystemExit("protected UI test produced no state marker")
          payload = base64.b64decode(matches[-1], validate=True)
          pathlib.Path(sys.argv[2]).write_bytes(payload)
          PY

      - name: Run protected live-WebMCP security regression
        working-directory: mobile/ios
        shell: bash
        run: |
          set -euo pipefail
          test -f "$PROTECTED_XCTESTRUN"
          rm -rf "$EVIDENCE_DIR/FabushiProtectedWebMcpSecurity.xcresult"
          xcodebuild test-without-building \
            -xctestrun "$PROTECTED_XCTESTRUN" \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath "$EVIDENCE_DIR/FabushiProtectedWebMcpSecurity.xcresult" \
            -only-testing:FabushiTests/ActiveMiniAppWebMcpSessionRegistryTests \
            -only-testing:FabushiTests/GlobalDharmaMiniAppParityTests/testWebMcpBridgeTrustIsBoundedToCanonicalLocalAndHostedOrigins \
            -only-testing:FabushiTests/GlobalDharmaMiniAppParityTests/testGlobalDharmaRequiresCurrentLocalPackageAndActivePageSession \
            -only-testing:FabushiTests/GlobalDharmaMiniAppParityTests/testGlobalDharmaOnlyGatesExactProtectedLocalCapability \
            -only-testing:FabushiTests/GlobalDharmaMiniAppParityTests/testMiniAppBridgeSessionRequiresExactInstanceNonceAndExplicitGrant \
            2>&1 | tee "$EVIDENCE_DIR/protected-webmcp-security.log"
          {
            echo "registry_security_tests=passed"
            echo "origin_fence_test=passed"
            echo "active_page_fence_test=passed"
            echo "protected_capability_fence_test=passed"
            echo "instance_nonce_grant_fence_test=passed"
          } > "$EVIDENCE_DIR/webmcp-security.env"

      - name: Require complete protected journey state
        shell: bash
        run: |
          set -euo pipefail
          test -s "$EVIDENCE_DIR/state.json"
          jq -e '
            .autoLogin == true and
            .searchedMiniApps == true and
            .globalDharmaVisible == true and
            .installedOrAlreadyInstalled == true and
            .botVisible == true and
            .naturalLanguageSent == true and
            .webMcpReady == true and
            .pageProvidedToolsObserved == true and
            .pageToolCount == 4 and
            .permissionDeniedObserved == true and
            .permissionApprovedObserved == true and
            .livePageMutationObserved == true and
            .bidirectionalStateObserved == true and
            (.initialRevision | type == "number") and
            (.botMutationRevision | type == "number") and
            (.manualMutationRevision | type == "number") and
            (.botMutationRevision > .initialRevision) and
            (.manualMutationRevision > .botMutationRevision) and
            .removedAtEnd == true
          ' "$EVIDENCE_DIR/state.json" >/dev/null
          test -s "$EVIDENCE_DIR/webmcp-security.env"
          grep -q '^registry_security_tests=passed$' "$EVIDENCE_DIR/webmcp-security.env"
          grep -q '^origin_fence_test=passed$' "$EVIDENCE_DIR/webmcp-security.env"
          grep -q '^active_page_fence_test=passed$' "$EVIDENCE_DIR/webmcp-security.env"
          grep -q '^protected_capability_fence_test=passed$' "$EVIDENCE_DIR/webmcp-security.env"
          grep -q '^instance_nonce_grant_fence_test=passed$' "$EVIDENCE_DIR/webmcp-security.env"
          if [ "${FABUSHI_E2E_REQUIRE_REAL_APPLE_COMMERCE:-0}" = "1" ]; then
            jq -e '
              .purchaseTapped == true and
              .entitlementAllowed == true and
              .restoreTapped == true and
              .commerceExternalBlock == false
            ' "$EVIDENCE_DIR/state.json" >/dev/null
          else
            jq -e '
              .purchaseTapped == false and
              .entitlementAllowed == false and
              .restoreTapped == false and
              .commerceExternalBlock == true
            ' "$EVIDENCE_DIR/state.json" >/dev/null
          fi

      - name: Collect evidence and remove protected session
        if: always()
        shell: bash
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set +e
          if [ -f "$EVIDENCE_DIR/video-recorder.pid" ]; then
            video_pid="$(cat "$EVIDENCE_DIR/video-recorder.pid")"
            kill -INT "$video_pid" 2>/dev/null || true
            wait "$video_pid" 2>/dev/null || true
          fi
          if [ -n "${UDID:-}" ]; then
            xcrun simctl io "$UDID" screenshot "$EVIDENCE_DIR/screenshots/999-final.png" || true
            xcrun simctl spawn "$UDID" log show --style compact --last 20m --predicate 'process == "Fabushi"' > "$EVIDENCE_DIR/fabushi-system.log" 2>&1 || true
          fi
          rm -f "${HOST_CI_SESSION:-}"

      - name: Package protected evidence provenance
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -d "$EVIDENCE_DIR"
          test -s "$EVIDENCE_DIR/source.env"
          python3 - "$EVIDENCE_DIR" <<'PY'
          import hashlib
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          output = root / "SHA256SUMS.txt"
          files = sorted(
              path for path in root.rglob("*")
              if path.is_file() and path != output
          )
          if not files:
              raise SystemExit("protected evidence directory is empty")
          with output.open("w", encoding="utf-8") as handle:
              for path in files:
                  digest = hashlib.sha256(path.read_bytes()).hexdigest()
                  relative = path.relative_to(root).as_posix()
                  handle.write(f"{digest}  {relative}\n")
          PY
          (
            cd "$EVIDENCE_DIR"
            shasum -a 256 -c SHA256SUMS.txt
          )

      - name: Upload protected-session evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fabushi-ios-protected-session-${{ github.event.pull_request.head.sha || inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ios-protected-session-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Erase protected-session Simulator
        if: always()
        shell: bash
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set +e
          if [ -n "${UDID:-}" ]; then
            xcrun simctl shutdown "$UDID" || true
            xcrun simctl erase "$UDID" || true
          fi

      - name: Verify Desktop main remained unchanged through protected acceptance
        if: always()
        run: python3 scripts/check-desktop-main-ios-architecture.py --authority-only

  global-dharma-offline:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 90
    env:
      FABUSHI_CI_TEST_USERNAME: ${{ secrets.FABUSHI_CI_TEST_USERNAME }}
      FABUSHI_CI_TEST_PASSWORD: ${{ secrets.FABUSHI_CI_TEST_PASSWORD }}
      FABUSHI_API_BASE_URL: ${{ vars.FABUSHI_API_BASE_URL || 'https://api.ombhrum.com' }}
      MAHAYANA_API_BASE_URL: ${{ vars.FABUSHI_API_BASE_URL || 'https://api.ombhrum.com' }}
      FABUSHI_FEATURE_HOST_TEST: '0'
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.source_sha }}
          fetch-depth: 1

      - name: Verify exact source and Desktop authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || inputs.source_sha }}"
          python3 scripts/check-desktop-main-ios-architecture.py --authority-only
          echo "EVIDENCE_DIR=$GITHUB_WORKSPACE/ios-global-dharma-offline-evidence" >> "$GITHUB_ENV"
          mkdir -p ios-global-dharma-offline-evidence
          {
            echo "repository=$GITHUB_REPOSITORY"
            echo "source_sha=$(git rev-parse HEAD)"
            echo "source_tree=$(git rev-parse HEAD^{tree})"
            echo "run_id=$GITHUB_RUN_ID"
            echo "run_attempt=$GITHUB_RUN_ATTEMPT"
            echo "network_isolation=runner-network-services-disabled"
            echo "public_probe=https://example.com/"
          } > ios-global-dharma-offline-evidence/provenance.env

      - name: Require bounded protected account
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FABUSHI_CI_TEST_USERNAME:-}"
          test -n "${FABUSHI_CI_TEST_PASSWORD:-}"
          test "${FABUSHI_FEATURE_HOST_TEST:-}" = "0"

      - name: Verify offline source boundaries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          model = Path("mobile/ios/Fabushi/MarketplaceModel.swift").read_text()
          commerce = Path("mobile/ios/Fabushi/GlobalDharmaCommerceModel.swift").read_text()
          surface = Path("mobile/ios/Fabushi/MiniAppWebMcpSurface.swift").read_text()
          init = model[model.index("func initializeApp() async"):model.index("private func applyAuth", model.index("func initializeApp() async"))]
          forbidden = ("await refresh()", "await refreshMcpBackendStatus()", "await refreshMcpServers()")
          if any(item in init for item in forbidden):
              raise SystemExit("cold app initialization still preflights Marketplace/MCP")
          if "await globalDharmaCommerce.refresh()" not in model:
              raise SystemExit("protected entitlement boundary missing")
          if "protectedMiniAppCapability" not in model:
              raise SystemExit("protected capability classifier missing")
          if "requiresActiveLocalWebMcpSession" not in surface:
              raise SystemExit("active-page local WebMCP fence missing")
          PY

      - name: Install simulator build tools
        shell: bash
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          rustup target add aarch64-apple-ios-sim

      - name: Boot clean simulator
        id: sim
        shell: bash
        run: |
          set -euo pipefail
          UDID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for xs in d.values() for x in xs if x["name"].startswith("iPhone")))')"
          xcrun simctl shutdown "$UDID" 2>/dev/null || true
          xcrun simctl erase "$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build app and UI tests once while online
        working-directory: mobile/ios
        shell: bash
        run: |
          set -euo pipefail
          ../../scripts/build-mahayana-ios.sh iphonesimulator arm64
          xcodegen generate
          xcodebuild build-for-testing             -project Fabushi.xcodeproj             -scheme Fabushi             -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}"             -derivedDataPath "$RUNNER_TEMP/FabushiOfflineDerivedData"
          xctestrun="$(find "$RUNNER_TEMP/FabushiOfflineDerivedData/Build/Products" -name '*.xctestrun' -type f -print -quit)"
          test -n "$xctestrun"
          echo "OFFLINE_XCTESTRUN=$xctestrun" >> "$GITHUB_ENV"

      - name: Prepare bounded refresh-token-free session
        shell: bash
        env:
          DEVICE_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}-ios-offline
          FABUSHI_CI_ACCOUNT_SESSION_FILE: ${{ runner.temp }}/fabushi-ci-offline/account-session.json
        run: |
          set -euo pipefail
          node .github/scripts/prepare-ios-ci-session.mjs
          test -s "$FABUSHI_CI_ACCOUNT_SESSION_FILE"
          test "$(stat -f '%Lp' "$FABUSHI_CI_ACCOUNT_SESSION_FILE")" = "600"
          echo "HOST_CI_SESSION=$FABUSHI_CI_ACCOUNT_SESSION_FILE" >> "$GITHUB_ENV"

      - name: Install built products
        shell: bash
        run: |
          set -euo pipefail
          app_bundle="$(find "$RUNNER_TEMP/FabushiOfflineDerivedData/Build/Products/Debug-iphonesimulator" -maxdepth 1 -name 'Fabushi.app' -type d -print -quit)"
          test_runner="$(find "$RUNNER_TEMP/FabushiOfflineDerivedData/Build/Products/Debug-iphonesimulator" -maxdepth 1 -name 'FabushiUITests-Runner.app' -type d -print -quit)"
          test -d "$app_bundle"
          test -d "$test_runner"
          xcrun simctl install "${{ steps.sim.outputs.udid }}" "$app_bundle"
          xcrun simctl install "${{ steps.sim.outputs.udid }}" "$test_runner"

      - name: Prepare canonical Marketplace install while online
        working-directory: mobile/ios
        shell: bash
        run: |
          set -euo pipefail
          test -s "$HOST_CI_SESSION"
          session_b64="$(python3 - "$HOST_CI_SESSION" <<'PY'
          import base64, pathlib, sys
          payload = pathlib.Path(sys.argv[1]).read_bytes()
          if not payload or len(payload) > 64 * 1024:
              raise SystemExit("invalid bounded session")
          print(base64.b64encode(payload).decode("ascii"), end="")
          PY
          )"
          export TEST_RUNNER_FABUSHI_CI_ACCOUNT_SESSION_BASE64="$session_b64"
          export TEST_RUNNER_FABUSHI_CI_API_BASE_URL="$FABUSHI_API_BASE_URL"
          export TEST_RUNNER_FABUSHI_E2E_SOURCE_SHA="${{ github.event.pull_request.head.sha || inputs.source_sha }}"
          rm -rf "$EVIDENCE_DIR/Prepare.xcresult"
          xcodebuild test-without-building             -xctestrun "$OFFLINE_XCTESTRUN"             -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}"             -resultBundlePath "$EVIDENCE_DIR/Prepare.xcresult"             -only-testing:FabushiUITests/GlobalDharmaJourneyUITests/testPrepareGlobalDharmaOfflineAcceptance             2>&1 | tee "$EVIDENCE_DIR/prepare.log"
          curl --fail --silent --show-error --connect-timeout 5 --max-time 10 https://example.com/ >/dev/null
          echo "online_public_probe=success" >> "$EVIDENCE_DIR/network-audit.env"

      - name: Prove public network isolation and run cold-start local WebMCP
        working-directory: mobile/ios
        shell: bash
        run: |
          set -euo pipefail
          enabled_file="$RUNNER_TEMP/fabushi-enabled-network-services.txt"
          : > "$enabled_file"
          restore_network() {
            while IFS= read -r service; do
              [ -z "$service" ] && continue
              sudo networksetup -setnetworkserviceenabled "$service" on >/dev/null 2>&1 || true
            done < "$enabled_file"
          }
          trap restore_network EXIT

          networksetup -listallnetworkservices | tail -n +2 | sed 's/^\*//' | while IFS= read -r service; do
            [ -z "$service" ] && continue
            if networksetup -getnetworkserviceenabled "$service" 2>/dev/null | grep -q "Enabled"; then
              printf '%s\n' "$service" >> "$enabled_file"
              sudo networksetup -setnetworkserviceenabled "$service" off
            fi
          done
          test -s "$enabled_file"

          probe_rc=0
          curl --fail --silent --show-error --connect-timeout 3 --max-time 8 https://example.com/ >/dev/null 2>"$EVIDENCE_DIR/offline-public-probe.stderr" || probe_rc=$?
          if [ "$probe_rc" -eq 0 ]; then
            echo "Public probe unexpectedly remained reachable after runner network isolation" >&2
            exit 3
          fi
          {
            echo "offline_public_probe=unreachable"
            echo "offline_public_probe_exit=$probe_rc"
          } >> "$EVIDENCE_DIR/network-audit.env"

          session_b64="$(python3 - "$HOST_CI_SESSION" <<'PY'
          import base64, pathlib, sys
          print(base64.b64encode(pathlib.Path(sys.argv[1]).read_bytes()).decode("ascii"), end="")
          PY
          )"
          export TEST_RUNNER_FABUSHI_CI_ACCOUNT_SESSION_BASE64="$session_b64"
          export TEST_RUNNER_FABUSHI_CI_API_BASE_URL="$FABUSHI_API_BASE_URL"
          export TEST_RUNNER_FABUSHI_E2E_SOURCE_SHA="${{ github.event.pull_request.head.sha || inputs.source_sha }}"
          export TEST_RUNNER_FABUSHI_E2E_NETWORK_ISOLATED=1

          rm -rf "$EVIDENCE_DIR/Offline.xcresult"
          set +e
          xcodebuild test-without-building             -xctestrun "$OFFLINE_XCTESTRUN"             -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}"             -resultBundlePath "$EVIDENCE_DIR/Offline.xcresult"             -only-testing:FabushiUITests/GlobalDharmaJourneyUITests/testGlobalDharmaOfflineColdStartHostWebMcpAndPersistence             2>&1 | tee "$EVIDENCE_DIR/offline.log"
          test_rc=${PIPESTATUS[0]}
          set -e

          restore_network
          trap - EXIT
          curl --fail --silent --show-error --connect-timeout 5 --max-time 15 https://example.com/ >/dev/null
          echo "restored_public_probe=success" >> "$EVIDENCE_DIR/network-audit.env"
          exit "$test_rc"

      - name: Extract and require offline evidence state
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$EVIDENCE_DIR/offline.log" "$EVIDENCE_DIR/state.json" <<'PY'
          import base64, pathlib, re, sys
          log = pathlib.Path(sys.argv[1]).read_text(errors="replace")
          matches = re.findall(r"FABUSHI_E2E_STATE_BASE64=([A-Za-z0-9+/=]+)", log)
          if not matches:
              raise SystemExit("offline UI test produced no state marker")
          pathlib.Path(sys.argv[2]).write_bytes(base64.b64decode(matches[-1], validate=True))
          PY
          jq -e '
            .offlineColdStart == true and
            .offlineHostRead == true and
            .offlineHostMutation == true and
            .offlinePersistenceRecovered == true and
            (.offlineMutationRevision | type == "number" and . > 0)
          ' "$EVIDENCE_DIR/state.json" >/dev/null
          grep -q '^online_public_probe=success$' "$EVIDENCE_DIR/network-audit.env"
          grep -q '^offline_public_probe=unreachable$' "$EVIDENCE_DIR/network-audit.env"
          grep -q '^restored_public_probe=success$' "$EVIDENCE_DIR/network-audit.env"

      - name: Verify Desktop authority remained unchanged
        if: always()
        run: python3 scripts/check-desktop-main-ios-architecture.py --authority-only

      - name: Package evidence provenance
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -d "$EVIDENCE_DIR"
          python3 - "$EVIDENCE_DIR" <<'PY'
          import hashlib, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          output = root / "SHA256SUMS.txt"
          files = sorted(p for p in root.rglob("*") if p.is_file() and p != output)
          with output.open("w", encoding="utf-8") as handle:
              for path in files:
                  handle.write(f"{hashlib.sha256(path.read_bytes()).hexdigest()}  {path.relative_to(root).as_posix()}\n")
          PY
          (cd "$EVIDENCE_DIR" && shasum -a 256 -c SHA256SUMS.txt)

      - name: Upload offline acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fabushi-ios-global-dharma-offline-${{ github.event.pull_request.head.sha || inputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ios-global-dharma-offline-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Cleanup simulator and bounded session
        if: always()
        shell: bash
        run: |
          set +e
          rm -f "${HOST_CI_SESSION:-}"
          xcrun simctl shutdown "${{ steps.sim.outputs.udid }}" || true
          xcrun simctl erase "${{ steps.sim.outputs.udid }}" || true
