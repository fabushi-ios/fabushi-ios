name: iOS TestFlight & Release Archive Gate

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact iOS source SHA to archive for physical device / TestFlight
        required: true
        type: string

permissions:
  contents: read

jobs:
  release-archive-gate:
    name: Physical-Device Release Archive & Signing Check
    runs-on: macos-15
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1

      - name: Verify live Desktop main authority
        run: python3 scripts/check_desktop_main_authority.py --authority-only

      - name: Select Xcode 16.4 & install tools
        run: |
          set -euo pipefail
          if [ -d /Applications/Xcode_16.4.app ]; then
            sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          fi
          command -v protoc >/dev/null 2>&1 || HOMEBREW_NO_AUTO_UPDATE=1 brew install protobuf
          command -v cmake >/dev/null 2>&1 || HOMEBREW_NO_AUTO_UPDATE=1 brew install cmake
          command -v xcodegen >/dev/null 2>&1 || HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cross-compile iphoneos arm64 staticlib & build Release xcarchive
        run: |
          set -euo pipefail
          ./scripts/build-mahayana-ios.sh iphoneos arm64
          xcodegen generate --spec mobile/ios/project.yml
          FABUSHI_USE_PREBUILT_RUST=1 xcodebuild archive \
            -project mobile/ios/Fabushi.xcodeproj \
            -scheme Fabushi \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Fabushi-release.xcarchive" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload unsigned Release archive digest
        uses: actions/upload-artifact@v4
        with:
          name: fabushi-release-xcarchive-${{ inputs.source_sha }}
          path: ${{ runner.temp }}/Fabushi-release.xcarchive
          retention-days: 14
