name: iOS Desktop main architecture parity

on:
  pull_request:

concurrency:
  group: ios-desktop-main-architecture-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IOS_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}

jobs:
  architecture:
    outputs:
      desktop_main_sha: ${{ steps.desktop-main-lock.outputs.sha }}
      desktop_main_tree_sha: ${{ steps.verify-live-main.outputs.tree }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact source checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$IOS_EXPECTED_HEAD"
          git show -s --format='source_sha=%H source_tree=%T' HEAD
      - name: Resolve live Desktop main and recorded predecessor
        id: desktop-main-lock
        shell: bash
        run: |
          set -euo pipefail
          LIVE_SHA="$(git ls-remote https://github.com/bhrumom/fabushi-desktop.git refs/heads/main | awk 'NR == 1 { print $1 }')"
          [[ "$LIVE_SHA" =~ ^[0-9a-f]{40}$ ]]
          LOCKED_SHA="$(python3 -c 'import json; print(json.load(open("manifests/desktop-main-authority.json"))["commit"])')"
          [[ "$LOCKED_SHA" =~ ^[0-9a-f]{40}$ ]]
          printf 'sha=%s\n' "$LIVE_SHA" >> "$GITHUB_OUTPUT"
          printf 'locked_sha=%s\n' "$LOCKED_SHA" >> "$GITHUB_OUTPUT"
      - name: Resolve exact source-delta predecessor
        id: source-delta-predecessor
        shell: bash
        run: python3 scripts/check-desktop-main-ios-architecture.py --resolve-source-delta-predecessor >> "$GITHUB_OUTPUT"
      - name: Checkout exact live Desktop main candidate
        uses: actions/checkout@v4
        with:
          repository: bhrumom/fabushi-desktop
          ref: ${{ steps.desktop-main-lock.outputs.sha }}
          path: desktop-main-source
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout recorded Desktop-main predecessor for snapshot integrity
        uses: actions/checkout@v4
        with:
          repository: bhrumom/fabushi-desktop
          ref: ${{ steps.desktop-main-lock.outputs.locked_sha }}
          path: desktop-main-locked-source
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout exact source-delta predecessor for candidate reconstruction
        uses: actions/checkout@v4
        with:
          repository: bhrumom/fabushi-desktop
          ref: ${{ steps.source-delta-predecessor.outputs.sha }}
          path: desktop-main-source-predecessor
          fetch-depth: 1
          persist-credentials: false
      - name: Verify live Desktop-main candidate checkout identity
        id: verify-live-main
        shell: bash
        run: |
          set -euo pipefail
          CHECKED_OUT_SHA="$(git -C desktop-main-source rev-parse HEAD)"
          CHECKED_OUT_TREE="$(git -C desktop-main-source rev-parse 'HEAD^{tree}')"
          LIVE_SHA="$(git ls-remote https://github.com/bhrumom/fabushi-desktop.git refs/heads/main | awk 'NR == 1 { print $1 }')"
          test "$CHECKED_OUT_SHA" = "$LIVE_SHA"
          test "$CHECKED_OUT_SHA" = "${{ steps.desktop-main-lock.outputs.sha }}"
          printf 'tree=%s\n' "$CHECKED_OUT_TREE" >> "$GITHUB_OUTPUT"
          git -C desktop-main-source show -s --format='desktop_source_sha=%H desktop_source_tree=%T' HEAD
      - name: Validate current-main candidate inventory without ledger promotion
        run: |
          set -euo pipefail
          python3 scripts/check-desktop-main-ios-architecture.py \
            --strict --current-main-candidate \
            --expected-live-main "${{ steps.desktop-main-lock.outputs.sha }}" \
            --desktop-checkout desktop-main-source \
            --locked-desktop-checkout desktop-main-locked-source \
            --source-predecessor-checkout desktop-main-source-predecessor \
            --candidate-report-dir desktop-main-candidate-authority
      - name: Test fail-closed Desktop-main source authority contracts
        run: python3 -m unittest discover -s tests -p 'test_desktop_main_authority.py'
      - name: Regression-test new Desktop source path classification
        run: python3 .github/scripts/test_generate_ios_desktop_main_rebaseline.py
      - name: Verify App Store readiness gate script
        run: python3 .github/scripts/wait-app-store-build.py --self-test
      - name: Test protected-session login preparation
        run: node --test .github/scripts/prepare-ios-ci-session.test.mjs

      - name: Upload live Desktop-main candidate authority report and identities
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-desktop-main-candidate-authority-${{ github.event.pull_request.head.sha }}
          path: desktop-main-candidate-authority/
          if-no-files-found: warn
          retention-days: 14
      - name: Verify Desktop main remained unchanged through job
        if: always()
        run: python3 scripts/check-desktop-main-ios-architecture.py --authority-only --expected-live-main "${{ steps.desktop-main-lock.outputs.sha }}"

  rust-host:
    needs: architecture
    runs-on: ubuntu-latest
    env:
      IOS_EXPECTED_DESKTOP_MAIN: ${{ needs.architecture.outputs.desktop_main_sha }}
      IOS_EXPECTED_DESKTOP_TREE: ${{ needs.architecture.outputs.desktop_main_tree_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact source checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$IOS_EXPECTED_HEAD"
          git show -s --format='source_sha=%H source_tree=%T' HEAD
      - name: Verify live Desktop main at job start
        run: python3 scripts/check-desktop-main-ios-architecture.py --authority-only --expected-live-main "$IOS_EXPECTED_DESKTOP_MAIN"
      - name: Install Linux dependencies for Rust Host graph
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev libxkbcommon-dev
      - name: Test canonical Rust Host Runner composition
        run: cargo test --manifest-path source/packages/mahayana-rs/Cargo.toml -p mahayana-host --lib --profile ci --features mobile-embedded
      - name: Test fail-closed product API origin allowlist
        run: cargo test --manifest-path source/packages/mahayana-rs/Cargo.toml -p mahayana-platform-client --lib --profile ci api_origin_
      - name: Test iOS-owned Rust Host modules and canonical messaging core
        run: |
          cargo test --manifest-path source/packages/mahayana-rs/Cargo.toml -p mahayana-feature-host --all-targets --profile ci
          cargo test --manifest-path source/packages/mahayana-rs/Cargo.toml -p mahayana-app-host-mobile --lib --profile ci
          cargo test --manifest-path source/packages/mahayana-messaging/Cargo.toml
      - name: Test canonical attachment Host direct boundary
        run: cargo test --manifest-path source/packages/mahayana-rs/Cargo.toml -p mahayana-app-host --lib --profile ci direct_attachment_host_methods_are_owner_scoped_and_bounded
      - name: Test generated Mini App install fences and offline recovery
        run: |
          cargo test --manifest-path source/packages/mahayana-rs/Cargo.toml -p mahayana-app-host --lib --profile ci local_fabapp_commit_records_fail_closed_after_cancel_or_stale_generation
          cargo test --manifest-path source/packages/mahayana-rs/Cargo.toml -p mahayana-plugin-runtime --lib --profile ci fabapp_local_generated_verifier_binds_account_draft_and_approval
          cargo test --manifest-path source/packages/mahayana-rs/Cargo.toml -p mahayana-plugin-runtime --lib --profile ci fabapp_local_generated_rejects_post_approval_mutation_and_privileged_egress
          cargo test --manifest-path source/packages/mahayana-rs/Cargo.toml -p mahayana-plugin-runtime --lib --profile ci fabapp_install_is_content_addressed_atomic_and_consumes_approval_once
          cargo test --manifest-path source/packages/mahayana-rs/Cargo.toml -p mahayana-plugin-runtime --lib --profile ci fabapp_install_survives_cold_installer_recreation
          cargo test --manifest-path source/packages/mahayana-rs/Cargo.toml -p mahayana-plugin-runtime --lib --profile ci fabapp_install_recovers_interrupted_staging_before_next_install
          cargo test --manifest-path source/packages/mahayana-rs/Cargo.toml -p mahayana-plugin-runtime --lib --profile ci fabapp_local_generated_upgrade_keeps_previous_and_rolls_back
          cargo test --manifest-path source/packages/mahayana-rs/Cargo.toml -p mahayana-plugin-runtime --lib --profile ci external_installer_commit_guard_prevents_stale_account_write
          cargo test --manifest-path source/packages/mahayana-rs/Cargo.toml -p mahayana-plugin-runtime --lib --profile ci fabapp_install_commit_guard_rejects_stale_account_before_writes
      - name: Test Skills lifecycle and Agent integration contracts
        run: cargo test --manifest-path source/packages/codex-rs/Cargo.toml -p codex-core-skills --all-targets

      - name: Test native MCP, persistence telemetry, Runtime projection, and protected account contracts
        run: |
          cargo test --manifest-path source/packages/mahayana-rs/Cargo.toml -p mahayana-mcp-runtime --all-targets --profile ci
          cargo test --manifest-path source/packages/mahayana-rs/Cargo.toml -p mahayana-kernel --lib --profile ci
          cargo test --manifest-path source/packages/mahayana-rs/Cargo.toml -p mahayana-model --lib --profile ci
          cargo test --manifest-path source/packages/mahayana-rs/Cargo.toml -p mahayana-native-engine --lib --profile ci
          cargo test --manifest-path source/packages/mahayana-rs/Cargo.toml -p mahayana-native-agent --lib --profile ci
          cargo test --manifest-path source/packages/mahayana-rs/Cargo.toml -p mahayana-computer --lib --profile ci
          cargo test --manifest-path source/packages/mahayana-rs/Cargo.toml -p mahayana-runtime --lib --profile ci
          cargo test --manifest-path source/packages/mahayana-rs/Cargo.toml -p mahayana-platform-client --lib --profile ci

      - name: Verify Desktop main remained unchanged through job
        if: always()
        run: python3 scripts/check-desktop-main-ios-architecture.py --authority-only --expected-live-main "$IOS_EXPECTED_DESKTOP_MAIN"

  build-and-test:
    needs:
      - architecture
      - rust-host
    runs-on: macos-15
    env:
      IOS_EXPECTED_DESKTOP_MAIN: ${{ needs.architecture.outputs.desktop_main_sha }}
      IOS_EXPECTED_DESKTOP_TREE: ${{ needs.architecture.outputs.desktop_main_tree_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact source checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$IOS_EXPECTED_HEAD"
          git show -s --format='source_sha=%H source_tree=%T' HEAD
      - name: Verify live Desktop main at job start
        run: python3 scripts/check-desktop-main-ios-architecture.py --authority-only --expected-live-main "$IOS_EXPECTED_DESKTOP_MAIN"
      - name: Require iOS-owned Rust product source
        shell: bash
        run: test -f source/packages/mahayana-rs/Cargo.toml
      - name: Install tools
        run: |
          brew install xcodegen
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - name: Verify strict Desktop-main architecture baseline
        run: python3 scripts/check-desktop-main-ios-architecture.py --authority-only --expected-live-main "$IOS_EXPECTED_DESKTOP_MAIN"
      - name: Test iOS-owned Rust internal/runtime modules
        run: cargo test --manifest-path source/packages/mahayana-rs/Cargo.toml -p mahayana-app-host-mobile --lib --profile ci
      - name: Build native runtime for simulator
        run: scripts/build-mahayana-ios.sh iphonesimulator arm64
      - name: Generate Xcode project
        working-directory: mobile/ios
        run: xcodegen generate
      - name: Select simulator
        id: sim
        shell: bash
        run: |
          set -euo pipefail
          UDID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; a=[(r,x) for r,vs in d.items() for x in vs if x.get("isAvailable") and x.get("name","").startswith("iPhone")]; p=[z for z in a if z[0]=="com.apple.CoreSimulator.SimRuntime.iOS-18-6" and z[1].get("name")=="iPhone 16 Pro"]; c=p or a; print(c[0][1]["udid"] if c else "")')"
          test -n "$UDID" || { echo 'No available iPhone simulator in the macos-15 runner inventory' >&2; exit 1; }
          xcrun simctl shutdown "$UDID" 2>/dev/null || true
          xcrun simctl erase "$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Build app and test bundles once
        working-directory: mobile/ios
        shell: bash
        run: |
          set -euo pipefail
          DERIVED="$RUNNER_TEMP/FabushiArchitectureDerivedData"
          rm -rf "$DERIVED"
          xcodebuild build-for-testing \
            -project Fabushi.xcodeproj \
            -scheme Fabushi \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$DERIVED"
          XCTESTRUN="$(find "$DERIVED/Build/Products" -name '*.xctestrun' -type f -print -quit)"
          test -n "$XCTESTRUN"
          test -f "$XCTESTRUN"
          APP_BUNDLE="$(find "$DERIVED/Build/Products/Debug-iphonesimulator" -maxdepth 1 -name 'Fabushi.app' -type d -print -quit)"
          UI_RUNNER="$(find "$DERIVED/Build/Products/Debug-iphonesimulator" -maxdepth 1 -name 'FabushiUITests-Runner.app' -type d -print -quit)"
          test -d "$APP_BUNDLE"
          test -d "$UI_RUNNER"
          xcrun simctl install "${{ steps.sim.outputs.udid }}" "$APP_BUNDLE"
          xcrun simctl install "${{ steps.sim.outputs.udid }}" "$UI_RUNNER"
          xcrun simctl get_app_container "${{ steps.sim.outputs.udid }}" com.ombhrum.fabushi app >/dev/null
          echo "ARCH_XCTESTRUN=$XCTESTRUN" >> "$GITHUB_ENV"
      - name: Unit tests
        working-directory: mobile/ios
        env:
          FABUSHI_UNIT_TEST_HOST: '1'
        run: |
          set -euo pipefail
          test -f "$ARCH_XCTESTRUN"
          xcodebuild test-without-building \
            -xctestrun "$ARCH_XCTESTRUN" \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -only-testing:FabushiTests
      - name: FPM-IOS-01..04 focused regression
        working-directory: mobile/ios
        env:
          FABUSHI_UNIT_TEST_HOST: '1'
        run: |
          set -euo pipefail
          test -f "$ARCH_XCTESTRUN"
          xcodebuild test-without-building \
            -xctestrun "$ARCH_XCTESTRUN" \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -only-testing:FabushiTests/MarketplaceModelLifecycleTests \
            -only-testing:FabushiTests/SharedMarketplaceClientParityTests \
            -only-testing:FabushiTests/SharedMcpOAuthLifecycleParityTests \
            -only-testing:FabushiTests/SharedMcpAuthWatchLifecycleParityTests \
            -only-testing:FabushiTests/SharedMcpAccountLifecycleParityTests \
            -only-testing:FabushiTests/SharedMcpManagerParityTests \
            -only-testing:FabushiTests/SharedMcpToolsDiscoveryParityTests \
            -only-testing:FabushiTests/SharedMcpCatalogMarketplaceParityTests \
            -only-testing:FabushiTests/CoordinatorMcpSurfaceTests \
            -only-testing:FabushiTests/ActiveMiniAppWebMcpSessionRegistryTests \
            -only-testing:FabushiTests/GlobalDharmaMiniAppParityTests \
            -only-testing:FabushiTests/OfflineMiniAppPackageVerifierTests \
            -only-testing:FabushiTests/SharedWorkflowModelParityTests \
            -only-testing:FabushiTests/SharedAccountMcpParityTests \
            -only-testing:FabushiTests/FabushiAppAgentSurfaceTests

      - name: UI tests
        working-directory: mobile/ios
        run: |
          set -euo pipefail
          test -f "$ARCH_XCTESTRUN"
          xcodebuild test-without-building \
            -xctestrun "$ARCH_XCTESTRUN" \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -only-testing:FabushiUITests

      - name: Verify Desktop main remained unchanged through job
        if: always()
        run: python3 scripts/check-desktop-main-ios-architecture.py --authority-only --expected-live-main "$IOS_EXPECTED_DESKTOP_MAIN"


      - name: Cleanup simulator
        if: always()
        shell: bash
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          set +e
          if [ -n "${UDID:-}" ]; then
            xcrun simctl shutdown "$UDID" || true
            xcrun simctl erase "$UDID" || true
          fi

  device-archive:
    needs:
      - architecture
      - rust-host
    runs-on: macos-15
    env:
      IOS_EXPECTED_DESKTOP_MAIN: ${{ needs.architecture.outputs.desktop_main_sha }}
      IOS_EXPECTED_DESKTOP_TREE: ${{ needs.architecture.outputs.desktop_main_tree_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact source checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$IOS_EXPECTED_HEAD"
          git show -s --format='source_sha=%H source_tree=%T' HEAD
      - name: Verify live Desktop main at job start
        run: python3 scripts/check-desktop-main-ios-architecture.py --authority-only --expected-live-main "$IOS_EXPECTED_DESKTOP_MAIN"
      - name: Install device build tools
        run: |
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          rustup target add aarch64-apple-ios
      - name: Build iOS-owned Rust runtime for physical devices
        run: scripts/build-mahayana-ios.sh iphoneos arm64
      - name: Generate Xcode project
        working-directory: mobile/ios
        run: xcodegen generate
      - name: Archive generic iOS device build without signing
        working-directory: mobile/ios
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/Fabushi-unsigned.xcarchive"
          xcodebuild archive \
            -project Fabushi.xcodeproj \
            -scheme Fabushi \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Fabushi-unsigned.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=''
          test -d "$RUNNER_TEMP/Fabushi-unsigned.xcarchive"
      - name: Package unsigned archive evidence
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          SOURCE_TREE="$(git rev-parse HEAD^{tree})"
          test "$SOURCE_SHA" = "$IOS_EXPECTED_HEAD"
          DESKTOP_HEAD_SHA="$IOS_EXPECTED_DESKTOP_MAIN"
          DESKTOP_TREE_SHA="$IOS_EXPECTED_DESKTOP_TREE"
          test "$DESKTOP_HEAD_SHA" = "$IOS_EXPECTED_DESKTOP_MAIN"
          test "$DESKTOP_TREE_SHA" = "$IOS_EXPECTED_DESKTOP_TREE"
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$SOURCE_TREE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DESKTOP_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DESKTOP_TREE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          mkdir -p device-archive-evidence
          # GITHUB_SHA is the PR merge ref, not the exact source we checked out.
          ARCHIVE_NAME="Fabushi-unsigned-${SOURCE_SHA}.xcarchive.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/Fabushi-unsigned.xcarchive" \
            "device-archive-evidence/$ARCHIVE_NAME"
          {
            printf 'IOS_HEAD_SHA=%s\n' "$SOURCE_SHA"
            printf 'IOS_EXPECTED_HEAD_SHA=%s\n' "$IOS_EXPECTED_HEAD"
            printf 'IOS_TREE_SHA=%s\n' "$SOURCE_TREE"
            printf 'DESKTOP_HEAD_SHA=%s\n' "$DESKTOP_HEAD_SHA"
            printf 'DESKTOP_TREE_SHA=%s\n' "$DESKTOP_TREE_SHA"
            printf 'RUN_ID=%s\n' "$GITHUB_RUN_ID"
            printf 'RUN_ATTEMPT=%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'WORKFLOW_EVENT_SHA=%s\n' "$GITHUB_SHA"
            printf 'REPOSITORY=%s\n' "$GITHUB_REPOSITORY"
            printf 'ARTIFACT_NAME=fabushi-ios-device-archive-%s\n' "$SOURCE_SHA"
            printf 'ARCHIVE_FILE=%s\n' "$ARCHIVE_NAME"
            printf 'EVIDENCE_KIND=unsigned-generic-ios-device-archive\n'
            printf 'INSTALL_UPGRADE_EXPORT_NOT_PROVEN=true\n'
          } > device-archive-evidence/source.env
          (
            cd device-archive-evidence
            shasum -a 256 "$ARCHIVE_NAME" source.env > SHA256SUMS.txt
            shasum -a 256 -c SHA256SUMS.txt
          )
      - name: Upload device archive evidence
        uses: actions/upload-artifact@v7
        with:
          name: fabushi-ios-device-archive-${{ github.event.pull_request.head.sha }}
          path: device-archive-evidence/
          if-no-files-found: error
          retention-days: 14

      - name: Verify Desktop main remained unchanged through job
        if: always()
        run: python3 scripts/check-desktop-main-ios-architecture.py --authority-only --expected-live-main "$IOS_EXPECTED_DESKTOP_MAIN"

  session-preparation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify exact source checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          git show -s --format='source_sha=%H source_tree=%T' HEAD
      - name: Test protected-session login preparation independently of Desktop authority
        run: node --test .github/scripts/prepare-ios-ci-session.test.mjs
