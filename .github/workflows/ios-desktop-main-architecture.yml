name: Desktop Main Authority Gate

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-main-authority-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-main-authority:
    name: Validate bhrum/gpui-telegram@main Authority & Inventory
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout fabushi-ios exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve live bhrum/gpui-telegram main head (start)
        id: upstream
        run: |
          set -euo pipefail
          LIVE="$(git ls-remote --heads https://github.com/bhrum/gpui-telegram.git refs/heads/main | awk '{print $1}')"
          test -n "$LIVE"
          echo "desktop_head=$LIVE" >> "$GITHUB_OUTPUT"
          echo "Observed live bhrum/gpui-telegram@main: $LIVE"

      - name: Clone pinned bhrum/gpui-telegram@main tree
        run: |
          set -euo pipefail
          rm -rf desktop-main-source
          git init desktop-main-source
          git -C desktop-main-source remote add origin https://github.com/bhrum/gpui-telegram.git
          git -C desktop-main-source fetch --depth 1 origin "${{ steps.upstream.outputs.desktop_head }}"
          git -C desktop-main-source checkout --detach FETCH_HEAD

      - name: Run authority validator unit tests & strict full-tree audit
        env:
          IOS_EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p "test_desktop_main_authority.py" -v
          python3 scripts/check-desktop-main-ios-architecture.py \
            --strict \
            --desktop-checkout desktop-main-source

      - name: Re-verify live bhrum/gpui-telegram main head (end)
        env:
          IOS_EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/check-desktop-main-ios-architecture.py --authority-only
