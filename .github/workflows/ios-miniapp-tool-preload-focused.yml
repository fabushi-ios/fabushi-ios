name: iOS Mini App tool preload focused

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - mobile/ios/Fabushi/MiniAppWebMcpSurface.swift
      - mobile/ios/FabushiTests/GlobalDharmaMiniAppParityTests.swift
      - .github/workflows/ios-miniapp-tool-preload-focused.yml

permissions:
  contents: read

env:
  IOS_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}

jobs:
  swift-miniapp-tool-preload:
    runs-on: macos-15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$IOS_EXPECTED_HEAD"
          mkdir -p "$RUNNER_TEMP/miniapp-tool-preload-evidence"
          git show -s --format='source_sha=%H source_tree=%T' HEAD | tee "$RUNNER_TEMP/miniapp-tool-preload-evidence/source-identity.txt"

      - name: Verify restricted production wiring
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/miniapp-tool-preload-evidence/production-wiring.txt"
          grep -F "func miniAppRestrictedToolPreloadJavaScript() -> String" mobile/ios/Fabushi/MiniAppWebMcpSurface.swift | tee "$evidence"
          grep -F "Object.defineProperty(window,'fabushi'" mobile/ios/Fabushi/MiniAppWebMcpSurface.swift | tee -a "$evidence"
          grep -F "if(!grants.has(name))return Promise.reject" mobile/ios/Fabushi/MiniAppWebMcpSurface.swift | tee -a "$evidence"

      - name: Install simulator build tools
        shell: bash
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim

      - name: Build iOS-owned Rust runtime for simulator
        shell: bash
        run: scripts/build-mahayana-ios.sh iphonesimulator arm64

      - name: Generate Xcode project
        working-directory: mobile/ios
        shell: bash
        run: xcodegen generate

      - name: Select and boot simulator
        id: sim
        shell: bash
        run: |
          set -euo pipefail
          UDID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; a=[(r,x) for r,vs in d.items() for x in vs if x.get("isAvailable") and x.get("name","").startswith("iPhone")]; p=[z for z in a if z[0]=="com.apple.CoreSimulator.SimRuntime.iOS-18-6" and z[1].get("name")=="iPhone 16 Pro"]; c=p or a; print(c[0][1]["udid"] if c else "")')"
          test -n "$UDID"
          xcrun simctl shutdown "$UDID" 2>/dev/null || true
          xcrun simctl erase "$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Test restricted Mini App preload compatibility
        working-directory: mobile/ios
        env:
          FABUSHI_UNIT_TEST_HOST: "1"
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/miniapp-tool-preload-evidence"
          printf '%s\n' "$IOS_EXPECTED_HEAD" > "$evidence/head-sha.txt"
          RESULT="$evidence/MiniAppToolPreload.xcresult"
          rm -rf "$RESULT"
          xcodebuild test \
            -project Fabushi.xcodeproj \
            -scheme Fabushi \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath "$RESULT" \
            -only-testing:FabushiTests/GlobalDharmaMiniAppParityTests/testMiniAppRestrictedPreloadCompatibilityExposesOnlyInvokeThroughGrantFencedWebMcpOwner \
            2>&1 | tee "$evidence/xcode-focused-tests.log"

      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-miniapp-tool-preload-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/miniapp-tool-preload-evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Erase focused-test Simulator
        if: always()
        shell: bash
        run: |
          set +e
          if [ -n "${{ steps.sim.outputs.udid }}" ]; then
            xcrun simctl shutdown "${{ steps.sim.outputs.udid }}" || true
            xcrun simctl erase "${{ steps.sim.outputs.udid }}" || true
          fi
