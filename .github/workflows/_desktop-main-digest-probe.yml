name: TEMP Desktop main digest probe

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  digest:
    if: github.event.pull_request.number == 3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: bhrumom/fabushi-desktop
          ref: e875a19b03b11d0de8eae5cbb671076d0b4cf638
          path: desktop-main-source
          fetch-depth: 1
          persist-credentials: false
      - name: Compute exact Git tree digests
        working-directory: desktop-main-source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, subprocess
          raw=subprocess.check_output(["git","ls-tree","-r","-l","-z","HEAD"])
          records={}
          for line in raw.split(b"\\0"):
              if not line: continue
              identity,name=line.split(b"\\t",1)
              mode,kind,sha,size=identity.decode("ascii").split()
              records[name.decode("utf-8")]=(mode,kind,sha,None if size=="-" else int(size))
          def digest(items):
              stream="".join(f"{path}\\0{mode}\\0{kind}\\0{sha}\\0{size if size is not None else '-'}\\n" for path,(mode,kind,sha,size) in sorted(items.items()))
              return hashlib.sha256(stream.encode("utf-8")).hexdigest()
          selected={p:x for p,x in records.items() if p.startswith("frontend/") or p.startswith("source/")}
          print(f"DESKTOP_HEAD={subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()}")
          print(f"DESKTOP_TREE={subprocess.check_output(['git','rev-parse','HEAD^{tree}'],text=True).strip()}")
          print(f"FULL_TRACKED={len(records)}")
          print(f"SELECTED={len(selected)}")
          print(f"FULL_TREE_SHA256={digest(records)}")
          print(f"SELECTED_TREE_SHA256={digest(selected)}")
          PY
