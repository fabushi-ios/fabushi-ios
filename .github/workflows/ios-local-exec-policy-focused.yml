name: iOS local-exec policy focused

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - source/packages/local-exec/constants.rs
      - source/packages/local-exec/shell-timeout.rs
      - source/packages/mahayana-rs/mahayana-app-host-mobile/src/lib.rs
      - .github/workflows/ios-local-exec-policy-focused.yml

permissions:
  contents: read

jobs:
  rust-local-exec-policy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Verify exact head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Install Rust host build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y pkg-config libclang-dev libxcb1-dev libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev libxkbcommon-dev

      - name: Test shipping local-exec policy modules
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/local-exec-policy-evidence"
          mkdir -p "$evidence"

          cargo test --manifest-path source/packages/mahayana-rs/Cargo.toml             -p mahayana-app-host-mobile --lib --profile ci             package_local_exec_constants::tests             2>&1 | tee "$evidence/constants.log"

          cargo test --manifest-path source/packages/mahayana-rs/Cargo.toml             -p mahayana-app-host-mobile --lib --profile ci             package_local_exec_shell_timeout::tests             2>&1 | tee "$evidence/shell-timeout.log"

          grep -F '#[path = "../../../local-exec/constants.rs"]'             source/packages/mahayana-rs/mahayana-app-host-mobile/src/lib.rs             | tee "$evidence/production-wiring.txt"
          grep -F 'mod package_local_exec_constants;'             source/packages/mahayana-rs/mahayana-app-host-mobile/src/lib.rs             | tee -a "$evidence/production-wiring.txt"
          grep -F '#[path = "../../../local-exec/shell-timeout.rs"]'             source/packages/mahayana-rs/mahayana-app-host-mobile/src/lib.rs             | tee -a "$evidence/production-wiring.txt"
          grep -F 'mod package_local_exec_shell_timeout;'             source/packages/mahayana-rs/mahayana-app-host-mobile/src/lib.rs             | tee -a "$evidence/production-wiring.txt"

          printf '%s\n' "${{ github.event.pull_request.head.sha }}" > "$evidence/head-sha.txt"

      - name: Upload focused evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ios-local-exec-policy-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/local-exec-policy-evidence
          if-no-files-found: error
