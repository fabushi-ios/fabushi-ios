[package]
name = "mahayana_app_host"
version = "1.3.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
name = "mahayana_app_host"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
# Core Telegram, AI, MiniApp & Gateway Crates (vendored from live bhrum/gpui-telegram@main v1.3.0)
gpui_telegram_core = { path = "../desktop_core/crates/gpui_telegram_core" }
gpui_telegram_proto = { path = "../desktop_core/crates/gpui_telegram_proto" }
gpui_telegram_common = { path = "../desktop_core/crates/gpui_telegram_common" }
gpui_telegram_media = { path = "../desktop_core/crates/gpui_telegram_media" }
gpui_telegram_webrtc = { path = "../desktop_core/crates/gpui_telegram_webrtc" }
gpui_telegram_agent = { path = "../desktop_core/crates/gpui_telegram_agent" }
gpui_telegram_client = { path = "../desktop_core/crates/gpui_telegram_client" }
gpui_telegram_cli = { path = "../desktop_core/crates/gpui_telegram_cli" }
fabushi_miniapp = { path = "../desktop_core/crates/fabushi_miniapp", features = ["server"] }
magpie_gateway = { path = "../desktop_core/crates/magpie_gateway" }

# Inherited Domain Crates
fabushi-messaging-core = { path = "../desktop_core/inherited/mahayana-messaging" }
mahayana-host-runtime = { path = "../desktop_core/inherited/host" }
mahayana-node-agent-coordinator = { path = "../desktop_core/inherited/node-agent-coordinator" }
mahayana-computer = { path = "../desktop_core/inherited/mahayana-rs/mahayana-computer" }
mahayana-host-protocol = { path = "../desktop_core/inherited/mahayana-rs/mahayana-host-protocol" }

# Async, Networking, Crypto, Storage, Spreadsheet & Concurrency
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls", "rustls-tls-webpki-roots", "socks", "stream"] }
rusqlite = { version = "0.39", features = ["bundled", "backup", "blob"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
argon2 = "0.5"
quick-xml = "0.41"
zip = { version = "9.0", default-features = false, features = ["deflate"] }
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde", "clock"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
gpui_telegram_server = { path = "../desktop_core/crates/gpui_telegram_server" }
axum = "0.8"
tower = "0.5"
tempfile = "3"
prost = "0.13"

[profile.dev]
opt-level = 0
debug = 0
strip = "debuginfo"
incremental = false
codegen-units = 256

[profile.test]
opt-level = 0
debug = 0
strip = "debuginfo"
incremental = false
codegen-units = 16

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
panic = "unwind"
debug = 0
strip = "debuginfo"
incremental = false

[patch.crates-io]
xattr = { path = "../desktop_core/vendor/xattr-0.2.3" }
