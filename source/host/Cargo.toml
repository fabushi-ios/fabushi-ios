[package]
name = "mahayana-mobile-bridge"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false
build = false

[lib]
name = "mahayana_app_host"
crate-type = ["staticlib", "cdylib"]

[dependencies]
# 8 Desktop Domain Crates integrated in source/desktop_core
gpui_telegram_core = { path = "../desktop_core/crates/gpui_telegram_core" }
gpui_telegram_proto = { path = "../desktop_core/crates/gpui_telegram_proto" }
gpui_telegram_client = { path = "../desktop_core/crates/gpui_telegram_client" }
gpui_telegram_media = { path = "../desktop_core/crates/gpui_telegram_media" }
gpui_telegram_webrtc = { path = "../desktop_core/crates/gpui_telegram_webrtc" }
gpui_telegram_agent = { path = "../desktop_core/crates/gpui_telegram_agent" }
fabushi-messaging-core = { path = "../desktop_core/inherited/mahayana-messaging" }
mahayana-host-runtime = { path = "../desktop_core/inherited/host" }

# Async Runtime & Utilities
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "time", "macros", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde", "clock"] }
thiserror = "2"
rusqlite = { version = "0.39", features = ["bundled"] }
parking_lot = "0.12"
libc = "0.2"
sha2 = "0.10"

[profile.dev]
opt-level = 0
debug = 0
strip = "debuginfo"
incremental = false
codegen-units = 256

[profile.test]
opt-level = 0
debug = 0
strip = "debuginfo"
incremental = false
codegen-units = 16

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "debuginfo"
