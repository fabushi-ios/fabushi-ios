[package]
name = "mahayana-node-agent-coordinator"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
base64 = "0.22"
rustls = "0.23"
rustls-pemfile = "2"
webpki-roots = "0.26"

[dev-dependencies]
rcgen = "0.13"
pretty_assertions = "1"

