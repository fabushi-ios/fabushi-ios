    google.protobuf.Struct force_background_shell_args = 30;
    google.protobuf.Struct force_background_subagent_args = 31;
    google.protobuf.Struct subagent_await_args = 37;
    google.protobuf.Struct smart_mode_classifier_args = 38;
    google.protobuf.Struct canvas_diagnostics_args = 40;
    google.protobuf.Struct shell_allowlist_precheck_args = 41;
