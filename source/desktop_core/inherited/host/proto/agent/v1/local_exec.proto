    google.protobuf.Struct list_mcp_resources_exec_result = 17;
    google.protobuf.Struct read_mcp_resource_exec_result = 18;
    google.protobuf.Struct mcp_state_exec_result = 36;
    google.protobuf.Struct fetch_result = 20;
    google.protobuf.Struct record_screen_result = 21;
    google.protobuf.Struct computer_use_result = 22;
    google.protobuf.Struct write_shell_stdin_result = 23;
    google.protobuf.Struct execute_hook_result = 27;
    google.protobuf.Struct subagent_result = 28;
    google.protobuf.Struct force_background_shell_result = 30;
    google.protobuf.Struct force_background_subagent_result = 31;
    google.protobuf.Struct subagent_await_result = 37;
    google.protobuf.Struct smart_mode_classifier_result = 38;
    google.protobuf.Struct canvas_diagnostics_result = 40;
    google.protobuf.Struct shell_allowlist_precheck_result = 41;
    google.protobuf.Struct mcp_allowlist_precheck_result = 42;
    google.protobuf.Struct web_fetch_allowlist_precheck_result = 43;
    google.protobuf.Struct git_diff_response = 44;
    google.protobuf.Struct pi_read_result = 46;
    google.protobuf.Struct pi_bash_result = 47;
    google.protobuf.Struct pi_edit_result = 48;
    google.protobuf.Struct pi_write_result = 49;
    google.protobuf.Struct pi_grep_result = 50;
    google.protobuf.Struct pi_find_result = 51;
    google.protobuf.Struct pi_ls_result = 52;
    google.protobuf.Struct conversation_search_result = 53;
    google.protobuf.Struct agent_store_conflict_result = 54;
    google.protobuf.Struct mini_swe_agent_bash_result = 55;
    google.protobuf.Struct adopt_result = 56;
  }
}

