[workspace]

[package]
name = "fabushi_miniapp_wasm"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
fabushi_miniapp = { path = "../fabushi_miniapp", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 0
debug = 0
strip = "debuginfo"
incremental = false

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
debug = 0
strip = "debuginfo"
incremental = false
