[package]
name = "fabushi_miniapp"
version = "1.3.0"
edition = "2024"
license = "Apache-2.0"
description = "Pure-Rust shared Mini App core for Global Dharma Offering & Zen Room"

[features]
default = []
server = ["dep:rusqlite", "dep:chrono", "dep:uuid"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.39", features = ["bundled", "backup", "blob"], optional = true }
chrono = { version = "0.4", features = ["serde", "clock"], optional = true }
uuid = { version = "1", features = ["v4", "serde"], optional = true }
